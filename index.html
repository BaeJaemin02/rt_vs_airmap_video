<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>전파 시뮬레이션 결과</title>
  <meta name="description" content="RT / AirMap 전파 시뮬레이션 결과 영상 동시 재생 뷰어">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <h1 id="libTitle">전파 시뮬레이션 결과 · Ray Tracing vs AirMap</h1>
    </div>

    <div class="topbar-actions">
      <button type="button" class="btn primary" id="restartAll">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg>
        <span>처음부터 동시 재생</span>
      </button>
      <button type="button" class="btn" id="toggleAll">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="fill i-play"><path d="M8 5.2v13.6L18.8 12z"/></svg>
        <svg viewBox="0 0 24 24" aria-hidden="true" class="fill i-pause"><path d="M6.8 5h3.6v14H6.8zM13.6 5h3.6v14h-3.6z"/></svg>
        <span class="lbl">모두 일시정지</span>
      </button>
      <button type="button" class="btn toggle" id="setLoop" aria-pressed="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3l3 3-3 3"/><path d="M4 12v-1a5 5 0 0 1 5-5h11"/><path d="M7 21l-3-3 3-3"/><path d="M20 12v1a5 5 0 0 1-5 5H4"/></svg>
        <span>전체 반복</span>
      </button>
    </div>
  </header>

  <main class="board" id="board" aria-live="polite"></main>

  <p class="hint">
    <kbd>Space</kbd> 모두 재생/일시정지 · <kbd>R</kbd> 처음부터 동시 재생 · <kbd>L</kbd> 전체 반복 ·
    영상 클릭: 그 영상만 재생/일시정지 · 더블클릭: 전체화면
  </p>

  <script src="assets/js/videos.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
